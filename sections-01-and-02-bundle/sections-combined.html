<!-- ================================================================= -->
<!-- SECTION 01: HERO                                                  -->
<!-- ================================================================= -->
<section data-screen-label="01 Hero" style="background:var(--color-surface, var(--color-text));position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;">
  <div style="max-width:1440px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:100vh;min-height:100dvh;padding:clamp(36px, 7.9vh, 64px) clamp(20px, 4vw, 48px) clamp(16px, 4vh, 28px);">
    <!-- Ambient Radial Glow overlay: fades in on scroll as light mode transitions to dark mode -->
    <div id="spec-hero-ambient-glow" style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(158,27,36,0.08) 0%, rgba(0,0,0,0.85) 65%, #000000 100%);pointer-events:none;z-index:0;opacity:1;will-change:opacity;"></div>
    <br/>
    <br/>
    <!-- Hero Top Spacer (Single Master Logo is centered dynamically from navbar) -->
    <div ref="{{ logoRef }}" style="display:none;" aria-hidden="true"></div>
    <div style="height:clamp(20px, 4vh, 48px);"></div>

    <!-- Hidden cue (for React ref integrity) -->
    <div ref="{{ heroCueRef }}" style="display:none;" aria-hidden="true"></div>
    
    <!-- BOTTOM ROW: Hero Copy -->
    <div ref="{{ heroCopyRef }}" class="spec-hero-copy-wrap" style="position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:var(--space-6);align-items:flex-end;justify-content:space-between;margin-top:clamp(40px, 12vh, 120px);">
      <h1 class="spec-hero-title" style="margin:0;max-width:16ch;font-family:var(--font-heading);font-size:clamp(28px,4.2vw,66px);line-height:1.04;color:#ffffff">You feel the brand before it speaks®</h1>
      <p class="spec-hero-desc" style="max-width:38ch;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;font-size:12px;line-height:2;color:#a89f91">Spec Media builds brand identities & campaigns for companies that care how things feel and how they are perceived over time.</p>
    </div>
    <div style="position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:var(--space-4);justify-content:space-between;margin-top:var(--space-6);padding-top:var(--space-4);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:#70685c">
      <span>brand strategy</span><span>campaign production</span><span>performance media</span><span>content systems</span><span>est. placeholder</span>
    </div>
  </div>
  <!-- Atmospheric transition bridging Section 01 into Section 02 seamlessly -->
  <div id="spec-s01-atmospheric-bridge" class="spec-section-bridge" style="display:none;height:0;"></div>
</section>

<!-- ================================================================= -->
<!-- SECTION 02: FRAME SCRUB & VIDEO                                   -->
<!-- ================================================================= -->
<section id="spec-scene2-section" data-screen-label="02 Frame scrub" style="background:#000000;position:relative;z-index:10;height:380vh">
  <div style="position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000000">
    <div ref="{{ scrubBoxRef }}" id="spec-scene2-stage" class="spec-scrub-box" style="position:relative;width:min(90vw, 1120px);aspect-ratio:16/9;max-height:80vh;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.8);background:radial-gradient(ellipse at center, rgba(30, 4, 7, 0.65) 0%, #000000 80%);will-change:transform,opacity;opacity:1;transform:none;">
      
      <!-- Ref placeholder for DCLogic stability (brain canvas removed per request) -->
      <div ref="{{ canvasScrubRef }}" style="display:none !important;width:0;height:0;position:absolute;pointer-events:none;" aria-hidden="true"></div>

      <!-- Phase 1: 24-Square Tile Assembly Container -->
      <div id="spec-tiles-container" style="position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;border-radius:inherit;overflow:hidden;">
      </div>

      <!-- Phase 2: Completed Master Reference Image -->
      <div id="spec-master-image" style="position:absolute;inset:0;width:100%;height:100%;z-index:4;opacity:0;pointer-events:none;transition:opacity 0.2s ease;">
        <img id="spec-master-img-el" src="/static/slices/duck_master.jpg" alt="Spec Media Master" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>

      <!-- Phase 3: Seamless Scroll-Controlled Video Scrubbing -->
      <video id="spec-scene2-video" src="/static/Main_hir_fastseek.mp4" playsinline muted preload="metadata" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;opacity:0;pointer-events:none;background:#000000;">
        <source id="spec-scene2-video-src" src="/static/Main_hir_fastseek.mp4" type="video/mp4">
      </video>

      <!-- Legacy ref tags preserved invisibly for DCLogic stability -->
      <div style="display:none !important;" aria-hidden="true">
        <span ref="{{ frameLabelRef }}"></span>
        <div ref="{{ scrubHintRef }}"></div>
        <div ref="{{ scrubBarRef }}"></div>
      </div>

    </div>
  </div>
</section>
