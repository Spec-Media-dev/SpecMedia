<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEC MEDIA — Atmospheric Cinema</title>
    <script>
        // If opened as a local static file or directly without the Django server port, redirect to the live site
        if (window.location.protocol === 'file:' || (window.location.port !== '8000')) {
            window.location.href = 'http://127.0.0.1:8000/en/';
        }
    </script>
    
    <!-- Google Fonts: Space Grotesk (Headlines), Lora (Editorial), Space Mono (Telemetry) -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Space+Grotesk:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           2. GLOBAL DESIGN SYSTEM & TOKENS
           ========================================================================== */
        :root {
            --color-surface: #000000;
            --color-surface-elevated: #0d0d0d;
            --color-surface-velvet: #2d0406;
            --color-brand-red: #b40119;
            --color-crimson: #df1637;
            --color-accent-gold: #c9a96e;
            --color-text-primary: #ffffff;
            --color-text-cream: #f5ead8;
            --color-text-muted: #a89f91;
            --color-border-subtle: rgba(245, 234, 216, 0.10);
            
            --font-hero: clamp(34px, 6.2vw, 84px);
            --font-h1: clamp(28px, 4.2vw, 66px);
            --font-h3: clamp(18px, 2.4vw, 32px);
            --font-body: clamp(13px, 1.1vw, 16px);
            --font-mono-meta: 10px;
            
            --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Hide default OS cursor */
        }

        body {
            background-color: var(--color-surface);
            color: var(--color-text-cream);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { color: var(--color-text-primary); }
        .mono { font-family: 'Space Mono', monospace; font-size: var(--font-mono-meta); text-transform: uppercase; letter-spacing: 0.18em; }
        
        /* ==========================================================================
           KINETIC DUAL-CURSOR PHYSICS
           ========================================================================== */
        #spec-cursor-dot, #spec-cursor-ring {
            position: fixed;
            top: 0; left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
        }

        #spec-cursor-dot {
            width: 6px; height: 6px;
            background-color: var(--color-crimson);
        }

        #spec-cursor-ring {
            width: 36px; height: 36px;
            border: 1px solid rgba(255,255,255,0.4);
            transition: width 0.3s var(--ease-cinematic), height 0.3s var(--ease-cinematic), background-color 0.3s var(--ease-cinematic), border-color 0.3s;
            display: flex; align-items: center; justify-content: center;
        }

        /* Hover States applied via JS class toggling */
        body.cursor-hovering #spec-cursor-ring {
            width: 64px; height: 64px;
            background-color: rgba(223, 22, 55, 0.15);
            border-color: var(--color-crimson);
        }

        /* ==========================================================================
           3. NAVIGATION CHROME & TELEMETRY HUD
           ========================================================================== */
        .spec-landing-chrome {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 72px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--color-border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(20px, 4vw, 48px);
        }

        .hud-left { display: flex; align-items: center; gap: 24px; }
        .status-pulse { width: 7px; height: 7px; background: #00ff66; border-radius: 50%; animation: pulse 2.4s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 8px #00ff66; } 50% { opacity: 0.4; box-shadow: none; } }

        /* ==========================================================================
           4. MASTER LOGO FLIGHT
           ========================================================================== */
        @keyframes specLogoFlightIntro {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); filter: blur(14px); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        #spec-flight-logo {
            position: fixed;
            top: 32%; left: 50%;
            width: min(88vw, 1200px); height: clamp(70px, 12vw, 140px);
            z-index: 1001; /* Above chrome to dock into it */
            transform-origin: center center;
            pointer-events: none;
            will-change: transform, filter;
            animation: specLogoFlightIntro 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
            filter: drop-shadow(0 0 24px rgba(223, 22, 55, 0.45));
        }

        .logo-svg { width: 100%; height: 100%; fill: #ffffff; }

        /* ==========================================================================
           SECTIONS LAYOUT
           ========================================================================== */
        section { width: 100vw; position: relative; }
        
        .s01-hero {
            height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at 50% 50%, rgba(180, 1, 25, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
        }

        .spec-hero-title {
            font-size: var(--font-hero);
            font-weight: 800;
            letter-spacing: -0.035em;
            text-align: center;
            margin-top: 120px; /* Offset for resting logo */
        }

        /* 03c Strategy Accordion (Hardware Accelerated Flexbox) */
        .s03-strategy {
            padding: clamp(64px, 10vh, 140px) clamp(20px, 4vw, 48px);
            min-height: 100vh;
        }

        #spec-accordion-gallery {
            display: flex;
            gap: 16px;
            width: 100%;
            height: 560px;
            max-width: 1440px;
            margin: 0 auto;
        }

        .accordion-panel {
            flex: 1 1 25%;
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border-subtle);
            border-radius: 12px;
            transition: flex 0.65s var(--ease-cinematic), transform 0.65s var(--ease-cinematic);
            position: relative;
            overflow: hidden;
        }

        .accordion-panel:hover { flex: 3.2 1 52%; }
        
        /* Sibling Compression Logic */
        #spec-accordion-gallery:has(.accordion-panel:hover) .accordion-panel:not(:hover) {
            flex: 0.8 1 16%;
            opacity: 0.6;
        }

        .panel-content { padding: 32px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
        .panel-title { font-size: var(--font-h3); text-transform: uppercase; }

        /* Placeholder for Section 2 to test scrolling */
        .s02-placeholder { height: 380vh; border-top: 1px solid var(--color-border-subtle); padding: 100px 48px; }
    </style>
</head>
<body>

    <!-- KINETIC CURSOR -->
    <div id="spec-cursor-dot"></div>
    <div id="spec-cursor-ring"></div>

    <!-- NAVIGATION CHROME -->
    <nav class="spec-landing-chrome">
        <div class="hud-left mono">
            <span class="status-pulse"></span>
            <span id="nav-scene-indicator">01 / INDEX</span>
            <span id="nav-coordinates">51.5074° N, 0.1278° W</span>
        </div>
        <div class="hud-right mono" data-cursor="pointer">
            [ EN | العربية ] &nbsp;&nbsp;&nbsp; [ MENU ]
        </div>
    </nav>

    <!-- MASTER FLIGHT LOGO -->
    <div id="spec-flight-logo">
        <svg class="logo-svg" viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="72" font-family="'Space Grotesk', sans-serif" font-weight="800" fill="#ffffff" letter-spacing="-2px">SPEC MEDIA</text>
        </svg>
    </div>

    <!-- SECTION 01: HERO -->
    <section class="s01-hero" id="scene-01">
        <h1 class="spec-hero-title">You feel the brand before it speaks®</h1>
    </section>

    <!-- SECTION 02: FRAME SCRUB (Placeholder for height & scroll test) -->
    <section class="s02-placeholder" id="scene-02">
        <h2 class="mono" style="color: var(--color-text-muted)">02 / FRAME SCRUB SEQUENCE (380vh SCROLL TRACK)</h2>
    </section>

    <!-- SECTION 03c: STRATEGY ACCORDION -->
    <section class="s03-strategy" id="scene-03">
        <h2 class="mono" style="margin-bottom: 40px; text-align: center;">03 / SYSTEM ARCHITECTURE</h2>
        <div id="spec-accordion-gallery">
            <div class="accordion-panel" data-cursor="pointer">
                <div class="panel-content">
                    <h3 class="panel-title">Strategy</h3>
                    <p class="mono">01</p>
                </div>
            </div>
            <div class="accordion-panel" data-cursor="pointer">
                <div class="panel-content">
                    <h3 class="panel-title">Visual Identity</h3>
                    <p class="mono">02</p>
                </div>
            </div>
            <div class="accordion-panel" data-cursor="pointer">
                <div class="panel-content">
                    <h3 class="panel-title">Motion Editorial</h3>
                    <p class="mono">03</p>
                </div>
            </div>
            <div class="accordion-panel" data-cursor="pointer">
                <div class="panel-content">
                    <h3 class="panel-title">Global Reach</h3>
                    <p class="mono">04</p>
                </div>
            </div>
        </div>
    </section>

    <!-- External Libraries for Production -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* ==========================================================================
               1. INERTIAL LENIS SMOOTH SCROLL (Decoupled Scroll Pipeline)
               ========================================================================== */
            const lenis = new Lenis({
                duration: 1.2,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                smoothWheel: true
            });

            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);

            /* ==========================================================================
               2. CUSTOM KINETIC CURSOR PHYSICS
               ========================================================================== */
            const dot = document.getElementById('spec-cursor-dot');
            const ring = document.getElementById('spec-cursor-ring');
            
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let ringX = mouseX;
            let ringY = mouseY;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                dot.style.transform = `translate(calc(${mouseX}px - 50%), calc(${mouseY}px - 50%))`;
            });

            // Interactive state mapping
            document.querySelectorAll('[data-cursor="pointer"]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hovering'));
            });

            const renderCursor = () => {
                // Spring Inertia Lerp (0.15)
                ringX += (mouseX - ringX) * 0.15;
                ringY += (mouseY - ringY) * 0.15;
                ring.style.transform = `translate(calc(${ringX}px - 50%), calc(${ringY}px - 50%))`;
                requestAnimationFrame(renderCursor);
            };
            requestAnimationFrame(renderCursor);

            /* ==========================================================================
               3. PARABOLIC LOGO FLIGHT ENGINE (Section 01 -> Chrome Dock)
               ========================================================================== */
            const logo = document.getElementById('spec-flight-logo');
            
            // Baseline Metrics from Spec
            const yRest = window.innerHeight / 2;
            const targetY = 36; // Chrome vertical center
            const flightDist = Math.max(220, Math.min(window.innerHeight * 0.48, 450)); // clamp(220, 48vh, 450)

            lenis.on('scroll', (e) => {
                const scrollY = e.scroll;
                
                // p = clamp(0, scrollY / flightDist, 1)
                const p = Math.max(0, Math.min(scrollY / flightDist, 1));
                
                // Scale smooth reduction: 1.0 -> 0.42 (1.0 - 0.58 = 0.42)
                const scale = 1.0 - (0.58 * p);
                
                // Parabolic Arc Formula: Y(p) = Y_rest - [(Y_rest - Y_nav_target) * p^1.35]
                const currentY = yRest - ((yRest - targetY) * Math.pow(p, 1.35));
                
                // Construct hardware-accelerated transform matrix
                logo.style.transform = `translate(-50%, -50%) translateY(${currentY - yRest}px) scale(${scale})`;
                
                // Telemetry HUD Update
                const indicator = document.getElementById('nav-scene-indicator');
                if(scrollY < window.innerHeight) indicator.innerText = '01 / INDEX';
                else if(scrollY < window.innerHeight * 4) indicator.innerText = '02 / FRAME';
                else indicator.innerText = '03 / WORK';
            });
            
            // Trigger initial position calc
            lenis.emit(); 
        });
    </script>
</body>
</html>
